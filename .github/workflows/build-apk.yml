name: Build My Deen APK

on:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fix #4 §4/§6: the old logo and the istighfar audio travel as base64
      # text files (assets/logo.b64, assets/istighfar.b64) because binary
      # files cannot be pushed through the text-only snapshot flow.
      # Decode them here, before `npx cap sync` copies www/ into the APK.
      - name: Decode bundled assets (logo + istighfar audio)
        run: |
          python3 -c "import base64; open('icons/my-deen-logo.png','wb').write(base64.b64decode(open('assets/logo.b64').read()))"
          python3 -c "import base64; d=base64.b64decode(open('assets/istighfar.b64').read()); open('www/audio/istighfar.mp3','wb').write(d); open('android/app/src/main/res/raw/istighfar.mp3','wb').write(d)"

      # Fix #4 §4: regenerate every app icon from the old logo.
      - name: Generate app icons from logo
        run: |
          pip install pillow
          python3 scripts/make_icons.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Run #12 showed sdkmanager is NOT on the runner's PATH by default
      # (exit 127, "command not found") once the setup-android step was
      # removed. The SDK itself is preinstalled at $ANDROID_HOME, so put
      # its cmdline-tools on PATH here (any installed version) instead.
      - name: Install Android SDK platform 36
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/lib/android-sdk}
          for d in "$ANDROID_HOME"/cmdline-tools/*/bin; do export PATH="$d:$PATH"; done
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.14.3

      - name: Install dependencies and sync web assets
        run: |
          npm ci
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-deen-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish debug release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-build-${{ github.run_number }}
          name: My Deen debug build ${{ github.run_number }}
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
